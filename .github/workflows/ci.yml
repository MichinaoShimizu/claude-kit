name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-docs-root-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: リポジトリルートの文書を検査する
        run: node scripts/document-structure-verifier.mjs

  verify-docs-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: verify-docs の自己検査を実行する（ドッグフーディング）
        run: bash ci-selfcheck.sh
