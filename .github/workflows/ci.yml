name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-docs-root-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: リポジトリルートと各パッケージの文書をそれぞれのルートで検査する
        run: |
          node verify-docs/scripts/verify-docs.mjs
          node verify-docs/scripts/verify-docs.mjs --root=agent-layout

  agent-layout-root-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: スキルとカスタムエージェントの配置・生成結果を検査する
        run: node agent-layout/scripts/sync-agent-layout.mjs

  package-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 各パッケージの ci-selfcheck.sh を自動で見つけて実行する（ドッグフーディング）
        run: |
          shopt -s nullglob
          scripts=(*/ci-selfcheck.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "ci-selfcheck.sh を持つパッケージが無い"
            exit 0
          fi
          status=0
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            bash "$script" || status=1
            echo "::endgroup::"
          done
          exit "$status"
